name: Persistent Web Desktop & Chrome

on:
  workflow_dispatch: # Jalankan manual lewat tab Actions

jobs:
  run-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Maksimal waktu jalan (sekitar 5.8 jam)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Memulihkan data lama agar tidak terhapus saat dijalankan ulang
      - name: Restore Data Pengguna (Cache)
        id: cache-data
        uses: actions/cache@v4
        with:
          path: /home/runner/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. Menyiapkan folder penyimpanan permanen & symlink
      - name: Setup Folder Penyimpanan
        run: |
          mkdir -p /home/runner/persistent-data/chrome-config
          mkdir -p /home/runner/persistent-data/Desktop
          mkdir -p /home/runner/persistent-data/Downloads
          
          # Hubungkan folder sistem ke folder cache
          mkdir -p ~/.config
          ln -sfn /home/runner/persistent-data/chrome-config ~/.config/google-chrome
          ln -sfn /home/runner/persistent-data/Desktop ~/Desktop
          ln -sfn /home/runner/persistent-data/Downloads ~/Downloads

      # 3. Install XFCE, XRDP, QEMU, noVNC, dan Tools Pendukung
      - name: Install Desktop Environment & Web VNC
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system cloud-image-utils wget lsof xfce4 xfce4-goodies xrdp novnc websockify tightvncserver dbus-x11
          echo "startxfce4" > ~/.xsession
          sudo chown $(whoami):$(whoami) ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      # 4. Hapus Chromium & Install Google Chrome Stabil
      - name: Install Google Chrome & Edit Launcher
        run: |
          sudo apt-get purge --auto-remove -y chromium chromium-browser || true
          rm -rf ~/.config/chromium ~/.cache/chromium
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -f -y
          rm -rf google-chrome-stable_current_amd64.deb

          # Modifikasi properti launcher Chrome
          sudo sed -i 's|Exec=/usr/bin/google-chrome-stable %U|Exec=/usr/bin/google-chrome-stable --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage %U|g' /usr/share/applications/google-chrome.desktop
          sudo sed -i 's|Exec=/usr/bin/google-chrome-stable|Exec=/usr/bin/google-chrome-stable --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage|g' /usr/share/applications/google-chrome.desktop

          # Buat shortcut di Desktop agar mudah diklik
          cp /usr/share/applications/google-chrome.desktop ~/Desktop/
          chmod +x ~/Desktop/google-chrome.desktop

      # 5. Jalankan VNC Server & noVNC Web Access
      - name: Start Web Desktop & Cloudflare Tunnel
        run: |
          # Set password VNC default: 123456
          mkdir -p ~/.vnc
          echo "123456" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Jalankan VNC Server di layar :1 (Resolusi 1366x768)
          vncserver :1 -geometry 1366x768 -depth 24

          # Jalankan noVNC di port 6080
          websockify -D --web=/usr/share/novnc/ 6080 localhost:5901

          # Download dan jalankan Cloudflare Tunnel untuk akses Web publik
          wget -q https://github.com
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          
          sleep 8
          echo "=========================================================="
          echo "AKSES WEB DESKTOP ANDA DI LINK BERIKUT (Tambahkan /vnc.html di akhir URL):"
          grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1 | awk '{print $1"/vnc.html"}'
          echo "Password VNC: 123456"
          echo "=========================================================="

          # Tahan workflow agar tetap berjalan (maksimal ~5 jam)
          # Jika ingin menyimpan data sebelum waktu habis, cukup Cancel workflow dari tab Actions
          sleep 18000

      # 6. Simpan kembali semua data meskipun workflow di-Cancel secara manual
      - name: Simpan Data Pengguna (Cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/persistent-data
          key: desktop-data-${{ github.run_id }}
