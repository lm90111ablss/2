name: Run Ubuntu RDP Desktop

on:
  workflow_dispatch:

jobs:
  run-rdp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Container
        run: |
          docker run -d \
            --name rdp \
            --platform=linux/amd64 \
            -p 6080:6080 \
            --restart unless-stopped \
            infinite8labs/ubuntu-desktop:latest

      - name: Install Google Chrome inside Container
        run: |
          docker exec -u 0 rdp bash -c "
            apt update && \
            apt install -y wget && \
            apt purge --auto-remove chromium chromium-browser -y && \
            rm -rf ~/.config/chromium ~/.cache/chromium && \
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && \
            apt install -y ./google-chrome-stable_current_amd64.deb && \
            rm -rf google-chrome-stable_current_amd64.deb && \
            apt install -f -y
          "

      - name: Configure Chrome Launcher Flags
        run: |
          docker exec -u 0 rdp bash -c "
            sed -i 's|/usr/bin/google-chrome-stable %U|/usr/bin/google-chrome-stable --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage %U|g' /usr/share/applications/google-chrome.desktop
          "

      - name: Expose Port 6080 via Cloudflare Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:6080 > cloudflared.log 2>&1 &
          sleep 8
          echo "=== PUBLIC ACCESS LINK ==="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflared.log | head -n 1
          echo "=========================="

      - name: Keep Workflow Running
        run: |
          echo "RDP Desktop sedang berjalan..."
          sleep 21600
