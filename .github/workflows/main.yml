
name: Debian Linux RDP

on:
  workflow_dispatch:

jobs:
  debian-rdp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Update System
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: Install XFCE and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      - name: Configure XRDP
        run: |
          echo "startxfce4" > ~/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Install Google Chrome
        run: |
          sudo apt update
          sudo apt install wget -y

          sudo apt purge --auto-remove -y chromium chromium-browser || true

          rm -rf ~/.config/chromium ~/.cache/chromium

          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt install ./google-chrome-stable_current_amd64.deb -y

          sudo apt install -f -y

          rm -f google-chrome-stable_current_amd64.deb

      - name: Edit Chrome Launcher Properties
        run: |
          mkdir -p ~/.local/share/applications

          cp /usr/share/applications/google-chrome.desktop \
             ~/.local/share/applications/google-chrome.desktop

          sed -i '/^Exec=/s|/usr/bin/google-chrome-stable|/usr/bin/google-chrome-stable --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage|' \
             ~/.local/share/applications/google-chrome.desktop

          update-desktop-database ~/.local/share/applications || true

      - name: Verify Installation
        run: |
          google-chrome-stable --version
          systemctl status xrdp --no-pager
          echo "Chrome Launcher Properties:"
          grep '^Exec=' ~/.local/share/applications/google-chrome.desktop

      - name: Environment Information
        run: |
          echo "Desktop: XFCE"
          echo "RDP: XRDP"
          echo "RDP Port: 3389"
          echo "Browser: Google Chrome"
